# Builds the Windows desktop app (.msi + NSIS .exe) on a GitHub-hosted Windows
# runner — no local Windows machine needed. Run it from the Actions tab
# (workflow_dispatch) to download the installers as artifacts, or push a tag
# like v0.1.0 to also attach them to a GitHub Release.
#
# The installers bundle the WebView2 bootstrapper, so Windows 10/11 users just
# run the .exe (WebView2 auto-installs if missing). They are unsigned, so the
# first launch shows a SmartScreen "unknown publisher" prompt — click
# "More info" then "Run anyway".
name: Windows build

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create a Release on tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Runs the configured beforeBuildCommand (tsc + vite build), compiles the
      # Rust app, and bundles the Windows .msi and NSIS .exe installers.
      - name: Build Windows app
        run: bun tauri build

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: telstar-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Attach installers to the Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
